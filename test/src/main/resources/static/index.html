<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sinh viên</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h3>DANH SÁCH SINH VIÊN</h3>

<input type="text" id="search" class="form-control mb-3"
       placeholder="Tìm theo tên..." onkeyup="searchStudent()">

<table class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>Tên</th>
        <th>Email</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody id="studentTable"></tbody>
</table>

<h4>Thêm sinh viên</h4>
<input id="id" class="form-control mb-2" placeholder="ID">
<input id="name" class="form-control mb-2" placeholder="Tên">
<input id="email" class="form-control mb-2" placeholder="Email">

<button class="btn btn-primary" onclick="addStudent()">Thêm</button>

<!-- Modal cập nhật sinh viên -->
<div id="updateModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Cập nhật sinh viên</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input id="updateId" type="hidden">
                <input id="updateName" class="form-control mb-2" placeholder="Tên">
                <input id="updateEmail" class="form-control mb-2" placeholder="Email">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                <button type="button" class="btn btn-primary" onclick="saveUpdate()">Lưu</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = "http://localhost:8080/api/students";

function loadStudents() {
    fetch(API)
        .then(res => res.json())
        .then(data => {
            let html = "";
            data.forEach(s => {
                html += `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.name}</td>
                    <td>${s.email}</td>
                    <td>
                        <button class="btn btn-warning btn-sm"
                            onclick="openUpdateForm(${s.id}, '${s.name}', '${s.email}')">Cập nhật</button>
                        <button class="btn btn-danger btn-sm"
                            onclick="deleteStudent(${s.id})">Xóa</button>
                    </td>
                </tr>`;
            });
            document.getElementById("studentTable").innerHTML = html;
        });
}

function addStudent() {
    const student = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value
    };

    fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(student)
    }).then(() => loadStudents());
}

function deleteStudent(id) {
    fetch(`${API}/delete/${id}`, { method: "POST" })
        .then(() => loadStudents());
}

function searchStudent() {
    const name = document.getElementById("search").value;
    fetch(`${API}/search?name=${name}`)
        .then(res => res.json())
        .then(data => {
            let html = "";
            data.forEach(s => {
                html += `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.name}</td>
                    <td>${s.email}</td>
                    <td></td>
                </tr>`;
            });
            document.getElementById("studentTable").innerHTML = html;
        });
}

function openUpdateForm(id, name, email) {
    document.getElementById("updateId").value = id;
    document.getElementById("updateName").value = name;
    document.getElementById("updateEmail").value = email;
    
    const modal = new bootstrap.Modal(document.getElementById("updateModal"));
    modal.show();
}

function saveUpdate() {
    const id = document.getElementById("updateId").value;
    const name = document.getElementById("updateName").value;
    const email = document.getElementById("updateEmail").value;

    fetch(`${API}/update/${id}?name=${name}&email=${email}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" }
    }).then(() => {
        bootstrap.Modal.getInstance(document.getElementById("updateModal")).hide();
        loadStudents();
    });
}

loadStudents();
</script>

</body>
</html>
